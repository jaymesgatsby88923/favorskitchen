<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Kitchen — Favor's Kitchen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/common.css" />
  <link rel="stylesheet" href="../css/student.css" />
</head>
<body>
  <div class="student-shell">
    <header class="student-header">
      <div class="student-header-brand">
        <svg class="logo-mark" viewBox="0 0 100 100" aria-hidden="true">
          <ellipse cx="50" cy="72" rx="34" ry="10" fill="none" stroke="#e2c06a" stroke-width="2"/>
          <path d="M22 58 Q22 28 50 28 Q78 28 78 58" fill="none" stroke="#e2c06a" stroke-width="2"/>
          <path d="M35 28 Q35 8 50 8 Q65 8 65 28" fill="none" stroke="#e2c06a" stroke-width="2"/>
          <path d="M44 48 C46 54 54 54 56 48" fill="none" stroke="#c9a24a" stroke-width="2"/>
          <path d="M50 42 V48" stroke="#c9a24a" stroke-width="2"/>
        </svg>
        <div class="brand-name">Favor's Kitchen</div>
      </div>
      <div class="student-header-actions">
        <button type="button" id="student-logout">Log out</button>
      </div>
    </header>

    <main class="student-main">
      <div class="welcome-card">
        <h1 id="welcome-title">Welcome!</h1>
        <p>Your student dashboard is coming soon. Here you'll see your enrolled programs, upcoming classes, and recipes.</p>
      </div>
    </main>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/student/dashboard.js"></script>
</body>
</html>
