<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curriculum — Favor's Kitchen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/common.css" />
  <link rel="stylesheet" href="../css/admin.css" />
  <link rel="stylesheet" href="../css/curriculum.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="admin-sidebar" aria-label="Admin sidebar"></aside>

    <main class="main-content">
      <header class="admin-toolbar">
        <div class="admin-toolbar-title">
          <h1>Curriculum</h1>
          <p>Manage cooking programs, weeks, and enrollments</p>
        </div>
        <input
          class="admin-search"
          type="search"
          id="curriculum-search"
          placeholder="Search curricula..."
          aria-label="Search curricula"
        />
        <button class="btn btn-primary" type="button" id="create-curriculum-btn">
          + CREATE CURRICULUM
        </button>
      </header>

      <div class="page-body">
        <div id="page-alert" class="alert alert-error hidden" role="alert"></div>

        <div class="filter-chips" role="tablist" aria-label="Filter by status">
          <button class="filter-chip active" type="button" data-status="">All</button>
          <button class="filter-chip" type="button" data-status="published">Published</button>
          <button class="filter-chip" type="button" data-status="draft">Draft</button>
        </div>

        <div class="data-table data-table--curriculum" id="curriculum-table">
          <div class="data-table-header">
            <span>Name</span>
            <span>Duration</span>
            <span>Status</span>
            <span>Students</span>
            <span>Updated</span>
          </div>
          <div id="curriculum-table-body">
            <div class="data-table-loading">Loading curricula...</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay hidden" id="create-modal" role="dialog" aria-modal="true" aria-labelledby="create-modal-title">
    <div class="modal-card">
      <h2 id="create-modal-title">Create curriculum</h2>
      <div id="create-alert" class="alert alert-error hidden" role="alert"></div>
      <form id="create-curriculum-form">
        <input type="hidden" id="edit-curriculum-id" name="curriculum_id" value="" />
        <div class="form-field">
          <label class="form-label" for="create-name">Name</label>
          <input class="form-input" type="text" id="create-name" name="name" required />
        </div>
        <div class="form-field">
          <label class="form-label" for="create-description">Description</label>
          <textarea class="form-input" id="create-description" name="description" rows="3"></textarea>
        </div>
        <div class="form-field">
          <label class="form-label" for="create-duration">Duration (weeks)</label>
          <input class="form-input" type="number" id="create-duration" name="duration_weeks" min="1" />
        </div>
        <div class="form-field">
          <label class="form-label" for="create-status">Status</label>
          <select class="form-input" id="create-status" name="status">
            <option value="draft">Draft</option>
            <option value="published">Published</option>
          </select>
        </div>
        <div class="modal-actions">
          <button class="btn btn-secondary" type="button" id="create-cancel-btn">Cancel</button>
          <button class="btn btn-primary" type="submit" id="create-submit-btn">Create</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/admin/curriculum.js"></script>
</body>
</html>
